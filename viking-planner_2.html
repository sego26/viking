<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viking Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#17130f; --bg-panel:#221c16; --bg-raised:#2b241c; --line:#3d3327;
    --ember:#d9540d; --ember-bright:#f2792c; --gold:#c9a227; --gold-bright:#e8bf3c;
    --steel:#7c8a94; --cav:#8a5a3c; --parchment:#ece3d3; --dim:#a89d8a;
    --danger:#b8402e; --ok:#6f9b52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--parchment); font-family:'Inter',sans-serif; }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(217,84,13,0.10), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(201,162,39,0.07), transparent 40%);
    min-height:100vh; padding:44px 16px 80px;
  }
  .wrap{ max-width:780px; margin:0 auto; }

  .banner{ text-align:center; margin-bottom:40px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  h1{ font-family:'Cinzel',serif; font-weight:900; font-size:clamp(30px,6vw,46px); margin:0 0 10px; text-shadow:0 0 30px rgba(217,84,13,0.35); }
  h1 span{ color:var(--ember-bright); }
  .sub{ color:var(--dim); font-size:15px; max-width:500px; margin:0 auto; line-height:1.5; }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:26px 22px 24px; margin-bottom:22px; position:relative; }
  .panel[data-step]::before{
    content:attr(data-step); position:absolute; top:-12px; inset-inline-start:20px; background:var(--ember); color:#1a1310;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; padding:3px 10px; border-radius:3px; letter-spacing:1px;
  }
  .panel h2{ font-family:'Cinzel',serif; font-size:18px; font-weight:700; margin:4px 0 16px; color:var(--gold-bright); }
  .hint{ font-size:13px; color:var(--dim); line-height:1.55; margin:-6px 0 16px; }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .pill{
    flex:1; min-width:120px; background:var(--bg-raised); border:1px solid var(--line); color:var(--dim);
    padding:12px 14px; border-radius:5px; cursor:pointer; text-align:center; font-size:14px; font-weight:600;
    transition:border-color .15s,color .15s,background .15s; user-select:none; font-family:inherit;
  }
  .pill:hover{ border-color:var(--ember); color:var(--parchment); }
  .pill.active{ background:linear-gradient(180deg,rgba(217,84,13,0.22),rgba(217,84,13,0.08)); border-color:var(--ember-bright); color:var(--parchment); }
  .pill small{ display:block; font-weight:400; font-size:11.5px; color:var(--dim); margin-top:3px; }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:560px){ .grid3{ grid-template-columns:1fr; } }
  .field{ margin-bottom:16px; } .field:last-child{ margin-bottom:0; }
  label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin-bottom:7px; font-weight:600; }
  input[type=number]{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--parchment);
    font-family:'JetBrains Mono',monospace; font-size:16px; padding:11px 13px; border-radius:5px; outline:none;
  }
  input[type=number]:focus{ border-color:var(--ember-bright); }
  .troop-label{ display:flex; align-items:center; gap:7px; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .sw-inf{ background:var(--steel); } .sw-cav{ background:var(--cav); } .sw-arc{ background:var(--gold); }
  .note{ font-size:11.5px; color:var(--dim); margin-top:6px; }

  input[type=range]{ width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--steel),var(--cav)); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--parchment); border:2px solid #1a1310; cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--parchment); border:2px solid #1a1310; cursor:pointer; }
  .split-top{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); margin-bottom:8px; }
  .split-top b{ color:var(--parchment); }

  /* ratio options */
  .empty{ text-align:center; color:var(--dim); font-size:14px; padding:18px 0 6px; }
  .opts{ display:grid; gap:10px; }
  .opt{
    display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:12px 14px; cursor:pointer;
    text-align:left; color:var(--parchment); font-family:inherit; width:100%;
  }
  .opt:hover{ border-color:var(--gold); }
  .opt.active{ border-color:var(--gold-bright); background:rgba(201,162,39,0.10); box-shadow:inset 0 0 0 1px rgba(232,191,60,0.25); }
  .opt .ratio{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; }
  .opt .tag{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:3px; margin-left:8px; vertical-align:2px; }
  .tag.rec{ background:var(--ember); color:#1a1310; }
  .opt .status{ font-size:12.5px; text-align:right; font-family:'JetBrains Mono',monospace; }
  .status.ok{ color:#a9c894; } .status.need{ color:#e0968a; }
  .opt .desc{ grid-column:1 / -1; font-size:12px; color:var(--dim); }
  .ratio-legend{ font-size:11.5px; color:var(--dim); margin-bottom:10px; font-family:'JetBrains Mono',monospace; }

  /* results */
  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:520px){ .summary{ grid-template-columns:1fr; } }
  .stat{ background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:12px; text-align:center; }
  .stat .n{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--gold-bright); }
  .stat .l{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-top:4px; }

  .msg{ border-radius:5px; padding:12px 15px; font-size:13.5px; margin-bottom:16px; border:1px solid; line-height:1.55; }
  .msg.ok{ background:rgba(111,155,82,0.10); border-color:rgba(111,155,82,0.4); color:#a9c894; }
  .msg.warn{ background:rgba(184,64,46,0.10); border-color:rgba(184,64,46,0.45); color:#e0968a; }
  .msg b{ color:var(--parchment); }

  .march{ background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:13px 15px; margin-bottom:10px; }
  .march.lead{ border-color:rgba(232,191,60,0.5); }
  .march .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; gap:10px; }
  .march .name{ font-family:'Cinzel',serif; font-weight:700; font-size:14px; }
  .march.lead .name{ color:var(--gold-bright); }
  .march .cap{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); white-space:nowrap; }
  .bar{ display:flex; height:18px; border-radius:3px; overflow:hidden; margin-bottom:9px; background:var(--bg); }
  .bar div{ height:100%; }
  .b-inf{ background:var(--steel); } .b-cav{ background:var(--cav); } .b-arc{ background:var(--gold); }
  .breakdown{ display:flex; gap:16px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--dim); }
  .breakdown b{ color:var(--parchment); }

  .copy{
    width:100%; margin-top:8px; background:transparent; border:1px solid var(--line); color:var(--parchment);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:11px; border-radius:5px; cursor:pointer;
  }
  .copy:hover{ border-color:var(--gold); }

  .gens .pill{ min-width:120px; flex:1 1 calc(25% - 10px); padding:11px 8px; font-family:'JetBrains Mono',monospace; }
  .tag.alt{ background:var(--steel); color:#1a1310; }
  .opt .ratio{ white-space:nowrap; }
  @media (max-width:560px){ .opt{ grid-template-columns:1fr; } .opt .status{ text-align:left; } }
  .lang{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:22px; }
  .lang button{ background:var(--bg-raised); border:1px solid var(--line); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; padding:6px 11px; border-radius:4px; cursor:pointer; letter-spacing:1px; }
  .lang button:hover{ border-color:var(--gold); color:var(--parchment); }
  .lang button.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:rgba(201,162,39,0.10); }
    .grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }
  .troop-h{ font-family:'Cinzel',serif; font-size:14px; color:var(--parchment); margin:4px 0 10px; display:flex; align-items:center; gap:8px; }
  .troop-h + .grid2{ margin-bottom:18px; }
  .sw-inf9{ background:#b3bec6; } .sw-cav9{ background:#c48a60; }
  .b-inf9{ background:#b3bec6; } .b-cav9{ background:#c48a60; }
  .march.home{ border-color:rgba(111,155,82,0.5); }
  .march.home .name{ color:#a9c894; }
  .march.risk{ border-color:rgba(184,64,46,0.6); }
  .march.risk .name{ color:#e0968a; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin:0 0 14px; }
  .legend span{ display:flex; align-items:center; gap:6px; }
  @media (max-width:560px){ .grid2.tiers{ grid-template-columns:1fr 1fr; } }
  input[type=range].bison{ background:linear-gradient(90deg,var(--line),var(--gold)); }
  .eff{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; background:var(--bg-raised); border:1px solid var(--gold); border-radius:5px; padding:12px 14px; font-size:13px; color:var(--dim); }
  .eff b{ font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--gold-bright); }
  .msg ul li{ margin:2px 0; }
  .copybox{ width:100%; margin-top:10px; background:var(--bg); color:var(--parchment); border:1px solid var(--gold); border-radius:5px; padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.5; resize:vertical; }
  .copybox[hidden]{ display:none; }
  .needs{ margin-top:18px; }
  .needs .msg{ margin-bottom:0; }
  .needs .wait{ font-size:12.5px; color:var(--dim); border:1px dashed var(--line); border-radius:5px; padding:11px 14px; line-height:1.5; }
  .needs ul{ margin:8px 0 0; padding-left:18px; }
  .needs li{ margin:3px 0; }
  .needs li.miss{ color:var(--dim); }
  .heal-res{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  @media (max-width:520px){ .heal-res{ grid-template-columns:1fr 1fr; } }
  .heal-intro{ font-size:13px; color:var(--dim); line-height:1.55; margin:0 0 14px; }
  .heal-intro b{ color:var(--parchment); }
  html[lang^=zh] label, html[lang^=zh] .stat .l{ letter-spacing:0; }
  .sum-text{ white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin:0; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.6; color:var(--parchment); }
  .heal-per{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); margin:0; }
  .footnote{ text-align:center; font-size:12px; color:var(--dim); margin-top:28px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="es">ES</button><button data-lang="pt">PT</button><button data-lang="zh-Hans">简体</button>
  </div>

  <div class="banner">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
  </div>

  <!-- 01 TROOPS -->
  <div class="panel" data-step="01">
    <h2 data-i="s1"></h2>
    <div class="troop-h"><span class="swatch sw-inf"></span><span data-i="inf"></span></div>
    <div class="grid2 tiers">
      <div class="field"><label for="infT10">T10</label><input type="number" id="infT10" min="0" step="1000" data-ph="120000"></div>
      <div class="field"><label for="infT9">T9</label><input type="number" id="infT9" min="0" step="1000" data-ph="80000"></div>
    </div>
    <div class="troop-h"><span class="swatch sw-cav"></span><span data-i="cav"></span></div>
    <div class="grid2 tiers">
      <div class="field"><label for="cavT10">T10</label><input type="number" id="cavT10" min="0" step="1000" data-ph="150000"></div>
      <div class="field"><label for="cavT9">T9</label><input type="number" id="cavT9" min="0" step="1000" data-ph="100000"></div>
    </div>
    <div class="note" data-i="archNote"></div>
  </div>

  <!-- 02 INFIRMARY -->
  <div class="panel" data-step="02">
    <h2 data-i="s2"></h2>
    <div class="field">
      <label for="infirm" data-i="infirmL"></label>
      <input type="number" id="infirm" min="0" step="1000" data-ph="100000">
      <div class="note" data-i="infirmNote"></div>
    </div>
  </div>

  <!-- 03 SQUAD DEPLOYMENT -->
  <div class="panel" data-step="03">
    <h2 data-i="s3"></h2>
    <div class="field">
      <label data-i="marchQ"></label>
      <div class="row">
        <button class="pill" data-marches="4">4</button>
        <button class="pill active" data-marches="5">5</button>
        <button class="pill" data-marches="6">6</button>
      </div>
    </div>
    <div class="field">
      <label for="squad" data-i="squadL"></label>
      <input type="number" id="squad" min="1000" step="1000" data-ph="90000">
      <div class="note" data-i="squadNote"></div>
    </div>
    <div id="needs" class="needs"></div>
  </div>

  <!-- 04 PET SKILL -->
  <div class="panel" data-step="04">
    <h2 data-i="s4"></h2>
    <div class="field">
      <label for="bison" data-i="bisonL"></label>
      <div class="split-top"><span id="bisonLv"></span><b id="bisonAdd"></b></div>
      <input type="range" id="bison" class="bison" min="0" max="10" step="1" value="0">
    </div>
  </div>

  <!-- 05 BUFF -->
  <div class="panel" data-step="05">
    <h2 data-i="s5"></h2>
    <div class="field">
      <label data-i="boostL"></label>
      <div class="row">
        <button class="pill active" data-boost="0"><span data-i="boostNone"></span><small>—</small></button>
        <button class="pill" data-boost="10">+10%<small data-i="gems2k"></small></button>
        <button class="pill" data-boost="20">+20%<small data-i="gems20k"></small></button>
      </div>
    </div>
    <div class="eff" style="margin-top:18px;"><span data-i="effL"></span><b id="effVal"></b></div>
  </div>

  <!-- 06 PLAN -->
  <div class="panel" data-step="06">
    <h2 data-i="s6"></h2>
    <div id="empty" class="empty"></div>
    <div id="results" style="display:none;">
      <div id="status"></div>
      <div class="summary">
        <div class="stat"><div class="n" id="sSent">–</div><div class="l" data-i="statSent"></div></div>
        <div class="stat"><div class="n" id="sInfirm">–</div><div class="l" data-i="statInfirm"></div></div>
        <div class="stat"><div class="n" id="sRisk">–</div><div class="l" data-i="statRisk"></div></div>
      </div>
      <div class="legend">
        <span><i class="swatch sw-inf"></i><span data-i="lgInf10"></span></span>
        <span><i class="swatch sw-inf9"></i><span data-i="lgInf9"></span></span>
        <span><i class="swatch sw-cav9"></i><span data-i="lgCav9"></span></span>
        <span><i class="swatch sw-cav"></i><span data-i="lgCav10"></span></span>
      </div>
      <div id="marchList"></div>
      <button class="copy" id="copyBtn" data-i="copy"></button>
    <textarea id="copyBox" class="copybox" readonly hidden></textarea>
    </div>
  </div>

  <!-- 07 HEALING COST -->
  <div class="panel" data-step="07">
    <h2 data-i="s7"></h2>
    <div id="healOut"></div>
  </div>

  <!-- 08 SUMMARY -->
  <div class="panel" data-step="08">
    <h2 data-i="s8"></h2>
    <div id="sumEmpty" class="empty"></div>
    <div id="sumWrap" style="display:none;">
      <pre id="sumText" class="sum-text"></pre>
      <button class="copy" id="sumBtn" data-i="sumCopy" style="margin-top:12px;"></button>
      <textarea id="sumBox" class="copybox" readonly hidden></textarea>
    </div>
  </div>

  <p class="footnote" data-i="footnote"></p>
</div>

<script>

      "lgCav9": "骑兵 T9",
      "lgCav10": "骑兵 T10",
      "copy": "复制计划到联盟聊天",
      "copied": "已复制 ✓",
      "copyManual": "此处无法复制——请选中下方文字手动复制",
      "footnote": "队伍先填步兵（T10 优先于 T9），再填骑兵（T9 优先于 T10）。留在城内的骑兵显示为总数，因为被打到哪个等级由攻击方决定。部队平均分配到各队伍。",
      "marchName": "第 {i} 队",
      "homeName": "营地 → 医院",
      "riskName": "超出医院容量",
      "allOut": "所有步兵和骑兵都能装进你的 {n} 支队伍——无人留守。",
      "spare": " 队伍中还有 {room} 空位。",
      "cavHome": "有 <b>{n}</b> 骑兵装不进队伍。把他们放到营地，请盟友攻击，让他们进入医院（容量 <b>{cap}</b>）——派多少由你决定。",
      "infHome": "有 <b>{n}</b> 步兵装不进队伍，只能留在城内。",
      "infNote": " 步兵总是优先派出，所以每支队伍都已满员。",
      "over": "有 <b>{n}</b> 部队超出医院容量，可能阵亡。你需要每队 <b>+{per}</b> 出征人数，或 <b>+{n}</b> 医院容量。",
      "fitsInfirm": "你的医院（{cap}）可以容纳剩余的全部 {used} 部队。",
      "noInfirm": "输入医院容量以检查留在城内的部队。",
      "waysH": "解决办法：",
      "wayBoost": "+{p}% 增益（{gems} 宝石）：{res}",
      "wayBison": "强力野牛 {lv} 级：{res}",
      "wayBisonMax": "强力野牛 10 级：{res}",
      "wayCombo": "+20% 增益加强力野牛 {lv} 级：{res}",
      "covers": "✓ 全部覆盖",
      "leaves": "仍超出 {n}",
      "copyHead": "维京复仇 — {n} 支队伍，每队 {cap}",
      "copyHome": "营地 → 医院",
      "copyRisk": "超出医院容量",
      "s4": "宠物技能",
      "s5": "出征增益",
      "s6": "你的计划",
      "needWait": "输入部队、医院容量和出征人数，即可查看需要的宠物技能或增益。",
      "needNone": "你的基础出征人数和医院容量已足够——无需宠物技能或增益。",
      "needOver": "不使用宠物技能或增益时，有 <b>{n}</b> 部队会超出医院容量。你需要每队 <b>+{per}</b> 出征人数（或 <b>+{n}</b> 医院容量）。",
      "needOpts": "以下任一方案即可：",
      "optNone": "无增益",
      "optBuff": "+{p}% 增益（{gems} 宝石）",
      "needLv": "强力野牛 {lv} 级",
      "needLv0": "无需宠物技能",
      "needMax": "不够——10 级时仍超出 {n}",
      "s7": "骑兵治疗费用",
      "bread": "面包",
      "wood": "木材",
      "stone": "石头",
      "iron": "铁矿",
      "healEmpty": "计划会显示治疗送入医院的骑兵的预估费用。",
      "healNone": "没有骑兵进入医院，无需治疗。",
      "healIntro": "按你的骑兵比例（{r10}% T10 / {r9}% T9）估算医院中 <b>{n}</b> 骑兵的费用：约 <b>{a}</b> T10 和 <b>{b}</b> T9。实际费用取决于每个等级各有多少进入医院。",
      "healPer": "每个骑兵（面包 / 木材 / 石头 / 铁矿）— T10：{t10} · T9：{t9}",
      "copyHeal": "骑兵治疗费用（估算）",
      "s8": "总结",
      "sumCopy": "复制总结",
      "sumEmpty": "完成上方步骤即可生成待办总结。",
      "sumHead": "维京复仇 — 待办事项",
      "sumBison": "开启强力野牛 {lv} 级（每队 +{add}）",
      "sumBoost": "使用 +{p}% 出征人数增益（{gems} 宝石）",
      "sumMarches": "派出 {n} 支队伍，每队 {cap}：",
      "sumEach": "每队：{line}",
      "sumCamp": "把 {n} 骑兵放到营地，请盟友攻击，让他们进入医院（容量 {cap}）",
      "sumAllOut": "全部部队都能装进队伍——无需放到营地",
      "sumInfHome": "注意：{n} 步兵装不下，只能留在城内",
      "sumOver": "注意：{n} 部队超出医院容量，可能阵亡——需要每队 +{per} 出征人数或 +{n} 医院容量",
      "sumFix": "解决办法：{w}",
      "sumHeal": "骑兵治疗费用（估算）：{res}"
    }
  };

  let lang = (() => {
    try { const s = localStorage.getItem('vkp-lang'); if (I18N[s]) return s; } catch (e) {}
    const full = (navigator.language || 'en').toLowerCase(), n = full.slice(0, 2);
    if (n === 'zh') return 'zh-Hans';
    return I18N[n] ? n : 'en';
  })();
  const L = () => I18N[lang];
  const T = (k, v = {}) => (L()[k] ?? I18N.en[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString(L().locale);
  const num = id => Math.max(0, Math.floor(parseFloat($(id).value) || 0));

  function applyLang(){
    document.documentElement.lang = L().html;
    document.documentElement.dir = L().dir;
    document.title = L().docTitle;
    document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = T(el.dataset.i));
    document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = `${T('eg')} ${Number(el.dataset.ph).toLocaleString(L().locale)}`);
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('vkp-lang', lang); } catch (e) {}
    applyLang(); update();
  });

  const state = { marches:5, boost:0 };
  function group(attr, fn){
    document.querySelectorAll(`[data-${attr}]`).forEach(el => el.onclick = () => {
      document.querySelectorAll(`[data-${attr}]`).forEach(p => p.classList.toggle('active', p === el));
      fn(el.dataset[attr]); update();
    });
  }
  group('marches', v => state.marches = +v);
  group('boost', v => state.boost = +v);
  ['infT10','infT9','cavT10','cavT9','squad','infirm','bison'].forEach(id => $(id).addEventListener('input', update));

  // Mighty Bison: +1,500 squad deployment per skill level (Lv1 1,500 … Lv10 15,000).
  const BISON_PER_LV = 1500;
  const GEMS = { 10:'2,000', 20:'20,000' };
  // Boost % applies to base deployment; Bison is a flat bonus on top.
  const effCap = (base, lv, boost) => Math.floor(base * (1 + boost / 100)) + lv * BISON_PER_LV;

  // Send priority: infantry T10, infantry T9, then cavalry T9, cavalry T10.
  const KEYS = ['i10','i9','c9','c10'];
  const COLOR = { i10:'b-inf', i9:'b-inf9', c9:'b-cav9', c10:'b-cav' };

  // Fill march space in priority order; return what's sent and what stays home.
  function allocate(t, cap, n){
    let space = cap * n;
    const sent = {}, home = {};
    for (const k of KEYS){ sent[k] = Math.min(t[k], space); space -= sent[k]; home[k] = t[k] - sent[k]; }
    return { sent, home, space };
  }
  const overFor = (t, cap, n, infirm) => { const { home } = allocate(t, cap, n); return Math.max(0, home.i10 + home.i9 + home.c9 + home.c10 - infirm); };

  // Spread each type evenly across n marches, never over cap.
  function spread(sent, n, cap){
    const marches = Array.from({ length:n }, () => ({ i10:0, i9:0, c9:0, c10:0 }));
    const room = () => marches.map(m => cap - KEYS.reduce((s, k) => s + m[k], 0));
    for (const k of KEYS){
      let left = sent[k];
      while (left > 0){
        const open = room().map((x, i) => [x, i]).filter(([x]) => x > 0);
        if (!open.length) break;
        const share = Math.max(1, Math.floor(left / open.length));
        for (const [x, i] of open){
          const give = Math.min(share, x, left);
          marches[i][k] += give; left -= give;
          if (!left) break;
        }
      }
    }
    return marches;
  }

  // What pet skill / buff is needed, judged from base deployment alone (ignores current picks).
  function renderNeeds(t, base, n, infirm, ready){
    const box = $('needs');
    if (!ready){ box.innerHTML = `<div class="wait">${T('needWait')}</div>`; return; }
    const over0 = overFor(t, effCap(base, 0, 0), n, infirm);
    if (!over0){ box.innerHTML = `<div class="msg ok">${T('needNone')}</div>`; return; }
    const items = [0, 10, 20].map(p => {
      const label = p ? T('optBuff', {p, gems:fmt(+GEMS[p].replace(/,/g, ''))}) : T('optNone');
      let lv = null;
      for (let l = 0; l <= 10; l++) if (!overFor(t, effCap(base, l, p), n, infirm)){ lv = l; break; }
      if (lv === 0) return `<li>${label} → <b>${T('needLv0')}</b></li>`;
      if (lv !== null) return `<li>${label} + <b>${T('needLv', {lv})}</b></li>`;
      return `<li class="miss">${label} + ${T('needLv', {lv:10})} → ${T('needMax', {n:fmt(overFor(t, effCap(base, 10, p), n, infirm))})}</li>`;
    });
    box.innerHTML = `<div class="msg warn">${T('needOver', {n:fmt(over0), per:fmt(Math.ceil(over0 / n))})}<br>${T('needOpts')}<ul>${items.join('')}</ul></div>`;
  }

  // Cavalry heal cost per troop (from the game).
  const RES = ['bread','wood','stone','iron'];
  const HEAL = { c10:{bread:244, wood:230, stone:47, iron:11}, c9:{bread:122, wood:115, stone:24, iron:6} };
  // Short form for big numbers: 12.3M, 450K.
  const short = v => v >= 1e9 ? (v / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'K' : fmt(v);

  // Copy text to clipboard; if blocked (e.g. inside a preview frame), show it so it can be copied by hand.
  function bindCopy(btnId, boxId, labelKey, text){
    const btn = $(btnId), box = $(boxId);
    box.hidden = true;
    btn.onclick = () => {
      const done = () => { box.hidden = true; btn.textContent = T('copied'); setTimeout(() => btn.textContent = T(labelKey), 1500); };
      const fail = () => { box.value = text; box.rows = text.split('\n').length; box.hidden = false; box.focus(); box.select(); btn.textContent = T('copyManual'); };
      let ok = false;
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
      } catch (e) {}
      if (ok) return done();
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    };
  }

  function update(){
    const t = { i10:num('infT10'), i9:num('infT9'), c9:num('cavT9'), c10:num('cavT10') };
    const baseRaw = num('squad');
    const base = Math.max(1, baseRaw);
    const lv = num('bison');
    const cap = effCap(base, lv, state.boost);
    const infirmRaw = $('infirm').value.trim();
    const infirm = num('infirm');
    const n = state.marches;
    const total = t.i10 + t.i9 + t.c9 + t.c10;

    $('bisonLv').textContent = lv ? T('bisonLv', {n:lv}) : T('bisonOff');
    $('bisonAdd').textContent = `+${fmt(lv * BISON_PER_LV)}`;
    $('effVal').textContent = fmt(cap);

    renderNeeds(t, baseRaw, n, infirm, total && baseRaw && $('infirm').value.trim() !== '');

    $('empty').textContent = T('empty');
    if (!total || !baseRaw){ $('empty').style.display = 'block'; $('results').style.display = 'none'; $('healOut').innerHTML = `<div class="empty">${T('healEmpty')}</div>`; $('sumEmpty').textContent = T('sumEmpty'); $('sumEmpty').style.display = 'block'; $('sumWrap').style.display = 'none'; return; }
    $('empty').style.display = 'none';

    const { sent, home, space } = allocate(t, cap, n);
    const marches = spread(sent, n, cap);
    const sentTotal = sent.i10 + sent.i9 + sent.c9 + sent.c10;
    const homeInf = home.i10 + home.i9, homeCav = home.c9 + home.c10, homeTotal = homeInf + homeCav;
    const toInfirm = Math.min(homeTotal, infirm);
    const over = homeTotal - toInfirm;

    const msgs = [], ways = [];
    if (!homeTotal){
      msgs.push(`<div class="msg ok">${T('allOut', {n})}${space > 0 ? T('spare', {room:fmt(space)}) : ''}</div>`);
    } else {
      if (homeInf) msgs.push(`<div class="msg warn">${T('infHome', {n:fmt(homeInf)})}${T('infNote')}</div>`);
      if (homeCav) msgs.push(`<div class="msg ok">${T('cavHome', {n:fmt(homeCav), cap:infirmRaw ? fmt(infirm) : '–'})}</div>`);
      if (!infirmRaw) msgs.push(`<div class="msg warn">${T('noInfirm')}</div>`);
      else if (over){
        const res = o => o ? T('leaves', {n:fmt(o)}) : T('covers');
        ways.length = 0;
        [10, 20].filter(p => p > state.boost).forEach(p =>
          ways.push(T('wayBoost', {p, gems:fmt(+GEMS[p].replace(/,/g, '')), res:res(overFor(t, effCap(base, lv, p), n, infirm))})));
        if (lv < 10){
          let need = null;
          for (let l = lv + 1; l <= 10; l++) if (!overFor(t, effCap(base, l, state.boost), n, infirm)){ need = l; break; }
          ways.push(need ? T('wayBison', {lv:need, res:T('covers')})
                         : T('wayBisonMax', {res:res(overFor(t, effCap(base, 10, state.boost), n, infirm))}));
        }
        // If nothing above covers it alone, try +20% together with Bison.
        if (!ways.some(w => w.includes(T('covers'))) && (state.boost < 20 || lv < 10)){
          let combo = null;
          for (let l = lv; l <= 10; l++) if (!overFor(t, effCap(base, l, 20), n, infirm)){ combo = l; break; }
          ways.push(combo !== null ? T('wayCombo', {lv:combo, res:T('covers')})
                                   : T('wayCombo', {lv:10, res:res(overFor(t, effCap(base, 10, 20), n, infirm))}));
        }
        const waysHtml = ways.length ? `<br>${T('waysH')}<ul style="margin:6px 0 0; padding-left:18px;">${ways.map(w => `<li>${w}</li>`).join('')}</ul>` : '';
        msgs.push(`<div class="msg warn">${T('over', {n:fmt(over), per:fmt(Math.ceil(over / n))})}${waysHtml}</div>`);
      }
      else msgs.push(`<div class="msg ok">${T('fitsInfirm', {used:fmt(toInfirm), cap:fmt(infirm)})}</div>`);
    }
    $('status').innerHTML = msgs.join('');

    $('sSent').textContent = fmt(sentTotal);
    $('sInfirm').textContent = infirmRaw ? fmt(infirm) : '–';
    $('sRisk').textContent = fmt(over);
    $('sRisk').style.color = over ? '#e0968a' : '';

    // Marches show each tier; home/infirmary show cavalry as one total.
    const card = (name, x, c, cls, unified) => {
      const tot = KEYS.reduce((s, k) => s + x[k], 0);
      const cav = unified ? `<span>${T('cav')} <b>${fmt(x.c9 + x.c10)}</b></span>`
                          : `<span>${T('cav')} T10 <b>${fmt(x.c10)}</b> · T9 <b>${fmt(x.c9)}</b></span>`;
      const inf = (x.i10 + x.i9 || !unified) ? `<span>${T('inf')} T10 <b>${fmt(x.i10)}</b> · T9 <b>${fmt(x.i9)}</b></span>` : '';
      const segs = unified ? [['b-inf', x.i10], ['b-inf9', x.i9], ['b-cav', x.c9 + x.c10]] : KEYS.map(k => [COLOR[k], x[k]]);
      return `<div class="march ${cls}">
        <div class="head"><span class="name">${name}</span><span class="cap">${fmt(tot)}${c ? ' / ' + fmt(c) : ''}</span></div>
        <div class="bar">${segs.map(([cl, v]) => `<div class="${cl}" style="width:${v / (c || tot || 1) * 100}%"></div>`).join('')}</div>
        <div class="breakdown">${inf}${cav}</div>
      </div>`;
    };

    // What stays home: cavalry into the infirmary first, then infantry.
    let room = infirm;
    const inInf = { i10:0, i9:0, c9:0, c10:0 }, risk = { i10:0, i9:0, c9:0, c10:0 };
    for (const k of ['c10','c9','i10','i9']){ const a = Math.min(home[k], room); inInf[k] = a; room -= a; risk[k] = home[k] - a; }

    // Cavalry in the infirmary, split T10/T9 by the player's overall cavalry ratio (the attacker decides the real mix).
    const cavIn = inInf.c9 + inInf.c10, cavAll = t.c10 + t.c9;
    const r10 = cavAll ? t.c10 / cavAll : 1;
    const est10 = Math.round(cavIn * r10), est9 = cavIn - est10;
    const hc = Object.fromEntries(RES.map(r => [r, est10 * HEAL.c10[r] + est9 * HEAL.c9[r]]));
    const perTxt = k => RES.map(r => fmt(HEAL[k][r])).join(' / ');
    $('healOut').innerHTML = cavIn
      ? `<p class="heal-intro">${T('healIntro', {n:fmt(cavIn), r10:Math.round(r10 * 100), r9:100 - Math.round(r10 * 100), a:fmt(est10), b:fmt(est9)})}</p>
         <div class="heal-res">${RES.map(r => `<div class="stat"><div class="n" title="${fmt(hc[r])}">~${short(hc[r])}</div><div class="l">${T(r)}</div></div>`).join('')}</div>
         <p class="heal-per">${T('healPer', {t10:perTxt('c10'), t9:perTxt('c9')})}</p>`
      : `<div class="msg ok" style="margin-bottom:0;">${T('healNone')}</div>`;

    let html = marches.map((m, i) => card(T('marchName', {i:i + 1}), m, cap, '', false)).join('');
    if (toInfirm) html += card(T('homeName'), inInf, infirm, 'home', true);
    if (over) html += card(T('riskName'), risk, 0, 'risk', true);
    $('marchList').innerHTML = html;

    const line = (x, u) => `${T('inf')} T10 ${fmt(x.i10)} / T9 ${fmt(x.i9)} | ${T('cav')} ` + (u ? fmt(x.c9 + x.c10) : `T10 ${fmt(x.c10)} / T9 ${fmt(x.c9)}`);
    const text = [T('copyHead', {n, cap:fmt(cap)})]
      .concat(marches.map((m, i) => `${T('marchName', {i:i + 1})}: ${line(m)}`))
      .concat(toInfirm ? [`${T('copyHome')}: ${line(inInf, true)}`] : [])
      .concat(over ? [`${T('copyRisk')}: ${line(risk, true)}`] : [])
      .concat(cavIn ? [`${T('copyHeal')}: ` + RES.map(r => `${T(r)} ~${short(hc[r])}`).join(' / ')] : []).join('\n');
    bindCopy('copyBtn', 'copyBox', 'copy', text);

    // To-do summary: what to switch on, what to send, what to watch out for.
    const fixes = ways.filter(w => w.includes(T('covers'))).map(w => w.replace(T('covers'), '').replace(/[\s:：]+$/, ''));
    const steps = [];
    if (lv) steps.push(T('sumBison', {lv, add:fmt(lv * BISON_PER_LV)}));
    if (state.boost) steps.push(T('sumBoost', {p:state.boost, gems:fmt(+GEMS[state.boost].replace(/,/g, ''))}));
    // Marches are spread evenly, so one line covers them all (any rounding difference is a few troops).
    steps.push(T('sumMarches', {n, cap:fmt(cap)}) + '\n   ' + T('sumEach', {line:line(marches[0])}));
    if (homeCav) steps.push(T('sumCamp', {n:fmt(infirmRaw ? Math.min(homeCav, infirm) : homeCav), cap:infirmRaw ? fmt(infirm) : '–'}));
    else if (!homeTotal) steps.push(T('sumAllOut'));
    const warns = [];
    if (homeInf) warns.push(T('sumInfHome', {n:fmt(homeInf)}));
    if (over) warns.push(T('sumOver', {n:fmt(over), per:fmt(Math.ceil(over / n))}) + (fixes.length ? '\n   ' + T('sumFix', {w:fixes.join(' / ')}) : ''));
    const sum = [T('sumHead'), '']
      .concat(steps.map((x, i) => `${i + 1}. ${x}`))
      .concat(warns.length ? [''].concat(warns.map(w => `⚠ ${w}`)) : [])
      .concat(cavIn ? ['', T('sumHeal', {res:RES.map(r => `${T(r)} ~${short(hc[r])}`).join(' / ')})] : []).join('\n');
    $('sumText').textContent = sum;
    $('sumEmpty').style.display = 'none'; $('sumWrap').style.display = 'block';
    bindCopy('sumBtn', 'sumBox', 'sumCopy', sum);
    $('results').style.display = 'block';
  }

  applyLang();
  update();
</script>
</body>
</html>
